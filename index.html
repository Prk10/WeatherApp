<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 
</head>
<body>

   <div class="card">
        <div class="search">
            <input class="search-input" type="text" spellcheck="false" placeholder="city">
            <button class="btn"><img src="images/search.png"></button>
        </div>

        <div class="weather">
            <img src="images/rain.png" class="weather-icon">
            <h1 class="temp"> 21°C </h1>
            <h2 class="city">Bengaluru</h2>

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                   <div>
                    <p class="humidity-value">50%</p>
                    <p class="humidity">Humidity</p>
                   </div>
                </div>

                <div class="col">
                    <img src="images/wind.png">
                   <div>
                    <p class="wind">10 km/h</p>
                    <p class="wind-speed">Wind Speed</p>
                   </div>
                </div>
            </div>
        </div>
   </div>



   <script src="script.js"></script>
    
</body>
</html>
